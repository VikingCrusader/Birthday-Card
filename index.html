<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生日烛光</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&family=Outfit:wght@400;500&family=Be+Vietnam+Pro:wght@400;600&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #1b0d12;
        --ground-2: #26121a;
        --ink: #fbe9dc;
        --ink-soft: #dba892;
        --ink-dim: #9c7268;
        --accent: #ff7a5c;
        --accent-2: #ffc26b;
        --line: rgba(255, 205, 170, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--ground);
        color: var(--ink);
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6vh 5vw;
        font-family: "Noto Serif SC", "Songti SC", serif;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      .stage {
        position: relative;
        width: 100%;
        max-width: 560px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        background: linear-gradient(180deg, var(--ground-2), #201017);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: clamp(2.2rem, 6vw, 3.6rem) clamp(1.8rem, 6vw, 3rem);
        box-shadow:
          0 40px 90px -30px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        text-align: center;
      }

      .eyebrow {
        font-family: "Outfit", sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin: 0 0 1.4rem;
      }

      #flame {
        display: block;
        margin: 0 auto 1rem;
      }

      .headline {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2em;
        margin: 0 0 0.7rem;
      }

      .headline-zh {
        font-family: "Ma Shan Zheng", "STXingkai", cursive;
        font-weight: 400;
        font-size: clamp(3rem, 11vw, 4.8rem);
        line-height: 1;
        color: var(--ink);
        text-shadow: 0 0 40px rgba(255, 122, 92, 0.35);
      }

      .headline-vi {
        font-family: "Caveat", cursive;
        font-weight: 600;
        font-size: clamp(1.3rem, 4.6vw, 1.85rem);
        line-height: 1.1;
        color: var(--ink-soft);
      }

      .to {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3em;
        margin: 0 0 1.6rem;
      }

      .to-zh {
        font-size: 1.05rem;
        color: var(--ink-soft);
        letter-spacing: 0.02em;
      }

      .to-vi {
        font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;
        font-size: 0.88rem;
        color: var(--ink-dim);
        letter-spacing: 0.01em;
      }

      .rule {
        width: 56px;
        height: 1px;
        margin: 0 auto 1.8rem;
        border: 0;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent-2),
          transparent
        );
        opacity: 0.6;
      }

      .message-wrap {
        max-width: 26em;
        margin: 0 auto;
      }

      .message {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .message::-webkit-scrollbar {
        display: none;
      }

      .message p {
        flex: 0 0 100%;
        scroll-snap-align: center;
        display: flex;
        align-items: center;
        min-height: 8.5em;
        text-align: left;
        font-size: 1.02rem;
        line-height: 1.95;
        color: var(--ink);
        margin: 0;
      }

      .message-dots {
        display: flex;
        justify-content: center;
        gap: 9px;
        margin-top: 0.6rem;
      }

      .dot {
        width: 6px;
        height: 6px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: var(--line);
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .dot.is-active {
        background: var(--accent-2);
        transform: scale(1.3);
      }

      .dot:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 194, 107, 0.3);
      }

      .message-actions {
        min-height: 2.7rem;
        margin-top: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .next-btn {
        background: none;
        border: none;
        color: var(--ink-soft);
        font-family: "Noto Serif SC", serif;
        font-size: 0.9rem;
        letter-spacing: 0.02em;
        padding: 0.5em 0.6em;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .next-btn:hover {
        color: var(--accent-2);
      }

      .next-btn:focus-visible {
        outline: none;
        color: var(--accent-2);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .card.lang-vi .next-btn {
        font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;
      }

      .signature {
        margin: 2.2rem 0 0;
        text-align: right;
        font-family: "Noto Serif SC", serif;
        font-style: normal;
        font-size: 0.95rem;
        color: var(--ink-soft);
        letter-spacing: 0.03em;
      }

      .notify-btn {
        background: none;
        border: 1px solid var(--line);
        color: var(--ink-soft);
        font-family: "Noto Serif SC", serif;
        font-size: 0.92rem;
        padding: 0.6em 1.5em;
        border-radius: 999px;
        cursor: pointer;
        transition:
          border-color 0.2s ease,
          color 0.2s ease;
      }

      .notify-btn:hover:not(:disabled) {
        border-color: var(--accent-2);
        color: var(--ink);
      }

      .notify-btn:focus-visible {
        outline: none;
        border-color: var(--accent-2);
        box-shadow: 0 0 0 3px rgba(255, 194, 107, 0.25);
      }

      .notify-btn:disabled {
        cursor: default;
        opacity: 0.75;
      }

      .card.lang-vi .notify-btn {
        font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;
      }

      .lang-toggle {
        position: absolute;
        top: 14px;
        right: 16px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: "Outfit", sans-serif;
        font-size: 0.68rem;
      }

      .lang-sep {
        color: var(--line);
      }

      .lang-btn {
        background: none;
        border: 1px solid transparent;
        color: var(--ink-dim);
        padding: 0.25em 0.4em;
        border-radius: 2px;
        line-height: 1;
        cursor: pointer;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
      }

      .lang-btn:hover {
        color: var(--ink-soft);
      }

      .lang-btn:focus-visible {
        outline: none;
        border-color: var(--accent-2);
      }

      .lang-btn.is-active {
        color: var(--accent-2);
      }

      /* Body copy swaps typefaces on toggle: Noto Serif SC doesn't cover
         Latin diacritics — Be Vietnam Pro does. Headline and the "to" line
         stay bilingual and untoggled, so they aren't touched here. */
      .card.lang-vi .message p {
        font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;
      }

      @media (max-width: 480px) {
        body {
          padding: 5vh 5vw;
        }
        .card {
          padding: 2.6rem 1.5rem;
        }
        .eyebrow {
          font-size: 0.6rem;
          letter-spacing: 0.22em;
          line-height: 1.6;
        }
        .headline-zh {
          font-size: clamp(2.7rem, 15vw, 4rem);
        }
        .headline-vi {
          font-size: clamp(1.15rem, 5.2vw, 1.5rem);
        }
        .message p {
          font-size: 0.98rem;
          line-height: 1.85;
        }
      }

      @media (max-width: 340px) {
        .headline-zh {
          font-size: 2.4rem;
        }
        .headline-vi {
          font-size: 1.05rem;
        }
      }

      /* entrance choreography — JS toggles these; page is fully visible without it */
      .fade-item {
        transition:
          opacity 0.9s cubic-bezier(0.16, 0.8, 0.24, 1),
          transform 0.9s cubic-bezier(0.16, 0.8, 0.24, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .fade-item {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="glow"></canvas>

      <main class="card">
        <div class="lang-toggle" role="group" aria-label="选择语言 / Chọn ngôn ngữ">
          <button type="button" class="lang-btn is-active" data-lang="zh" aria-pressed="true" aria-label="切换为中文">中</button>
          <span class="lang-sep" aria-hidden="true">/</span>
          <button type="button" class="lang-btn" data-lang="vi" aria-pressed="false" aria-label="Chuyển sang tiếng Việt">Việt</button>
        </div>

        <p class="eyebrow fade-item">A LITTLE LIGHT, JUST FOR YOU</p>

        <canvas id="flame" width="34" height="52"></canvas>

        <!-- EDIT ①: 标题固定双语显示（不跟着切换按钮变），中文在上、越南语在下 -->
        <h1 class="headline fade-item">
          <span class="headline-zh">生日快乐</span>
          <span class="headline-vi">Chúc Mừng Sinh Nhật</span>
        </h1>

        <!-- EDIT ②: 收件人称呼固定双语显示（不跟着切换按钮变），中文在上、越南语在下 -->
        <p class="to fade-item">
          <span class="to-zh">致 阮小姐</span>
          <span class="to-vi">Gửi Nguyễn</span>
        </p>

        <hr class="rule fade-item" />

        <!-- EDIT ③: 把下面三段祝福语换成你想说的话，中越文都要改。
             越南语是机翻打底，建议找母语者/朋友再确认一遍用词。
             这部分现在是左右滑动翻页，手机上直接划，也可以点下面的小圆点切页 -->
        <div class="message-wrap fade-item">
          <div class="message" id="messageTrack">
            <p data-zh="又是一年，你依然是这世界上，最让我安心大笑的人。" data-vi="Lại một năm nữa trôi qua, cậu vẫn luôn là người khiến tớ cười thoải mái và an tâm nhất trên đời.">
              又是一年，你依然是这世界上，最让我安心大笑的人。
            </p>
            <p data-zh="愿新的一岁，所有的努力都被看见，所有的热爱都值得。" data-vi="Chúc tuổi mới của cậu, mọi nỗ lực đều được nhìn thấy, mọi đam mê đều xứng đáng.">
              愿新的一岁，所有的努力都被看见，所有的热爱都值得。
            </p>
            <p data-zh="生日快乐，往后的每一年，我们都一起过。" data-vi="Chúc mừng sinh nhật, những năm sau này, mình sẽ cùng nhau đón từng năm.">生日快乐，往后的每一年，我们都一起过。</p>
          </div>
          <div class="message-dots" id="messageDots">
            <button type="button" class="dot is-active" data-index="0" aria-label="祝福 1 / 3"></button>
            <button type="button" class="dot" data-index="1" aria-label="祝福 2 / 3"></button>
            <button type="button" class="dot" data-index="2" aria-label="祝福 3 / 3"></button>
          </div>
          <div class="message-actions">
            <button type="button" id="nextBtn" class="next-btn" data-zh="下一页 →" data-vi="Tiếp theo →">下一页 →</button>
            <button type="button" id="notifyBtn" class="notify-btn" hidden></button>
          </div>
        </div>

        <!-- EDIT ④: 落款一般是名字，专有名词，两种语言保持一致即可 -->
        <p class="signature fade-item">—— 译文</p>
      </main>
    </div>

    <script>
      (function () {
        var reduced =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // ---- language toggle (中文 / Tiếng Việt) ----
        var langBtns = document.querySelectorAll(".lang-btn");
        var translatable = document.querySelectorAll("[data-zh]");
        var cardEl = document.querySelector(".card");
        var currentLang = "zh";

        function setLang(lang) {
          currentLang = lang;
          translatable.forEach(function (el) {
            el.style.transitionDuration = ".3s";
            el.style.transitionDelay = "0s";
            el.style.opacity = "0";
          });
          setTimeout(
            function () {
              translatable.forEach(function (el) {
                el.textContent = el.getAttribute("data-" + lang);
                el.style.opacity = "1";
              });
            },
            reduced ? 0 : 260,
          );

          langBtns.forEach(function (btn) {
            var active = btn.dataset.lang === lang;
            btn.classList.toggle("is-active", active);
            btn.setAttribute("aria-pressed", active ? "true" : "false");
          });
          cardEl.classList.toggle("lang-vi", lang === "vi");
          document.documentElement.lang = lang === "vi" ? "vi" : "zh-CN";
          renderNotifyBtn();
        }

        langBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            setLang(btn.dataset.lang);
          });
        });

        // ---- "我收到了" -> notifies zhyiwen820@gmail.com via Web3Forms ----
        // 换成你在 https://web3forms.com 用 zhyiwen820@gmail.com 申请到的 Access Key
        var WEB3FORMS_KEY = "f250eaf2-2481-4433-9cb2-1905b8469b2a";
        var NOTIFIED_KEY = "birthday-card-notified";

        var notifyText = {
          idle: { zh: "我收到啦 💌", vi: "Mình nhận được rồi 💌" },
          sending: { zh: "发送中…", vi: "Đang gửi…" },
          done: { zh: "已经通知啦 ✓", vi: "Đã báo rồi ✓" },
          error: {
            zh: "没发出去，再点一下试试",
            vi: "Gửi chưa được, thử lại nhé",
          },
        };
        var notifyState = "idle";

        var notifyBtn = document.getElementById("notifyBtn");

        function renderNotifyBtn() {
          if (!notifyBtn) return;
          notifyBtn.textContent = notifyText[notifyState][currentLang];
          notifyBtn.disabled = notifyState === "sending" || notifyState === "done";
        }

        if (notifyBtn) {
          try {
            if (localStorage.getItem(NOTIFIED_KEY)) notifyState = "done";
          } catch (e) {}
          renderNotifyBtn();

          notifyBtn.addEventListener("click", function () {
            notifyState = "sending";
            renderNotifyBtn();

            fetch("https://api.web3forms.com/submit", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({
                access_key: WEB3FORMS_KEY,
                subject: "🕯️ 生日贺卡被打开啦",
                from_name: "生日烛光贺卡",
                message:
                  "对方点了「我收到了」，时间：" +
                  new Date().toLocaleString("zh-CN", {
                    timeZone: "Asia/Shanghai",
                  }),
              }),
            })
              .then(function (r) {
                return r.json();
              })
              .then(function (data) {
                if (!data.success) throw new Error(data.message || "failed");
                notifyState = "done";
                renderNotifyBtn();
                try {
                  localStorage.setItem(NOTIFIED_KEY, "1");
                } catch (e) {}
              })
              .catch(function () {
                notifyState = "error";
                renderNotifyBtn();
              });
          });
        }

        // ---- swipeable message carousel ----
        // "我收到了" only shows once the last page has been reached;
        // "下一页" drives (and hides itself on) that last page.
        var msgTrack = document.getElementById("messageTrack");
        var dots = document.querySelectorAll(".dot");
        var nextBtn = document.getElementById("nextBtn");
        var totalPages = msgTrack.children.length;
        var currentPage = 0;

        function updatePageState(idx) {
          currentPage = idx;
          dots.forEach(function (dot, i) {
            dot.classList.toggle("is-active", i === idx);
          });
          var isLast = idx === totalPages - 1;
          nextBtn.hidden = isLast;
          notifyBtn.hidden = !isLast;
        }

        function scrollToPage(i) {
          i = Math.max(0, Math.min(totalPages - 1, i));
          msgTrack.scrollTo({
            left: i * msgTrack.clientWidth,
            behavior: reduced ? "auto" : "smooth",
          });
          updatePageState(i);
        }

        dots.forEach(function (dot, i) {
          dot.addEventListener("click", function () {
            scrollToPage(i);
          });
        });

        nextBtn.addEventListener("click", function () {
          scrollToPage(currentPage + 1);
        });

        var msgScrollTimer;
        msgTrack.addEventListener("scroll", function () {
          clearTimeout(msgScrollTimer);
          msgScrollTimer = setTimeout(function () {
            updatePageState(
              Math.round(msgTrack.scrollLeft / msgTrack.clientWidth),
            );
          }, 80);
        });

        updatePageState(0);

        // ---- entrance choreography ----
        var items = document.querySelectorAll(".fade-item");
        if (!reduced) {
          items.forEach(function (el, i) {
            el.style.opacity = "0";
            el.style.transform = "translateY(14px)";
            el.style.transitionDelay = i * 140 + "ms";
          });
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              items.forEach(function (el) {
                el.style.opacity = "1";
                el.style.transform = "translateY(0)";
              });
            });
          });
        }

        // ---- ambient candlelight glow behind the card ----
        var glow = document.getElementById("glow");
        var gctx = glow.getContext("2d");
        var W,
          H,
          dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resize() {
          W = window.innerWidth;
          H = window.innerHeight;
          glow.width = W * dpr;
          glow.height = H * dpr;
          glow.style.width = W + "px";
          glow.style.height = H + "px";
          gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener("resize", resize);
        resize();

        var blobs = [
          {
            x: 0.3,
            y: 0.35,
            r: 0.32,
            c: "rgba(255,122,92,0.16)",
            sx: 0.00021,
            sy: 0.00017,
            phase: 0,
          },
          {
            x: 0.68,
            y: 0.6,
            r: 0.3,
            c: "rgba(255,194,107,0.13)",
            sx: 0.00016,
            sy: 0.00023,
            phase: 2,
          },
          {
            x: 0.5,
            y: 0.8,
            r: 0.26,
            c: "rgba(255,90,110,0.10)",
            sx: 0.00019,
            sy: 0.00014,
            phase: 4,
          },
        ];

        function drawGlow(t) {
          gctx.clearRect(0, 0, W, H);
          gctx.fillStyle = "#1b0d12";
          gctx.fillRect(0, 0, W, H);
          blobs.forEach(function (b) {
            var cx = (b.x + Math.sin(t * b.sx + b.phase) * 0.04) * W;
            var cy = (b.y + Math.cos(t * b.sy + b.phase) * 0.04) * H;
            var r = b.r * Math.max(W, H);
            var g = gctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            g.addColorStop(0, b.c);
            g.addColorStop(1, "rgba(0,0,0,0)");
            gctx.fillStyle = g;
            gctx.beginPath();
            gctx.arc(cx, cy, r, 0, Math.PI * 2);
            gctx.fill();
          });
        }

        if (reduced) {
          drawGlow(0);
        } else {
          (function loop(t) {
            drawGlow(t || 0);
            requestAnimationFrame(loop);
          })();
        }

        // ---- small flickering flame above the headline ----
        var flame = document.getElementById("flame");
        var fctx = flame.getContext("2d");
        var fw = 34,
          fh = 52;
        flame.width = fw * dpr;
        flame.height = fh * dpr;
        flame.style.width = fw + "px";
        flame.style.height = fh + "px";
        fctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        function drawFlame(t) {
          fctx.clearRect(0, 0, fw, fh);
          var wob = reduced
            ? 0
            : Math.sin(t * 0.006) * 1.4 + Math.sin(t * 0.017) * 0.6;
          var cx = fw / 2 + wob;
          var baseY = fh - 10;

          // wick
          fctx.strokeStyle = "rgba(60,40,35,.9)";
          fctx.lineWidth = 2;
          fctx.beginPath();
          fctx.moveTo(fw / 2, baseY);
          fctx.lineTo(fw / 2, baseY - 8);
          fctx.stroke();

          // outer flame
          var g1 = fctx.createRadialGradient(
            cx,
            baseY - 22,
            1,
            cx,
            baseY - 18,
            20,
          );
          g1.addColorStop(0, "rgba(255,238,196,0.95)");
          g1.addColorStop(0.4, "rgba(255,170,90,0.85)");
          g1.addColorStop(1, "rgba(255,122,92,0)");
          fctx.fillStyle = g1;
          fctx.beginPath();
          fctx.moveTo(cx, baseY - 40 + (reduced ? 0 : Math.sin(t * 0.01) * 2));
          fctx.quadraticCurveTo(cx + 9, baseY - 24, cx + 5, baseY - 8);
          fctx.quadraticCurveTo(cx, baseY - 2, cx - 5, baseY - 8);
          fctx.quadraticCurveTo(cx - 9, baseY - 24, cx, baseY - 40);
          fctx.fill();

          // inner core
          fctx.fillStyle = "rgba(255,246,220,0.95)";
          fctx.beginPath();
          fctx.ellipse(cx, baseY - 14, 3, 6, 0, 0, Math.PI * 2);
          fctx.fill();
        }

        if (reduced) {
          drawFlame(0);
        } else {
          (function loopFlame(t) {
            drawFlame(t || 0);
            requestAnimationFrame(loopFlame);
          })();
        }
      })();
    </script>
  </body>
</html>
